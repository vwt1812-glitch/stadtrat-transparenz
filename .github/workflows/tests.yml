name: Tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/*.mjs"
      - "test/**"
      - "package.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
