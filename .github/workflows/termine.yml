name: Termine aktualisieren

on:
  schedule:
    - cron: "17 * * * *" # stündlich
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "assets/render.mjs"
      - "data/antraege.json"
      - "data/ausschuesse.json"
      - "data/budget.json"
      - ".github/workflows/termine.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

# Termine und Anträge schreiben beide in main – nie gleichzeitig laufen lassen
concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  termine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Kalender abrufen
        run: npm run termine

      - name: Inhalte in index.html schreiben
        run: npm run render

      - name: Änderungen committen
        run: |
          git add data/termine.json index.html impressum.html datenschutz.html assets/app.mjs
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Termine aktualisieren"
          git pull --rebase
          git push
