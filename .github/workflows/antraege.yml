name: Anträge aktualisieren

on:
  schedule:
    - cron: "23 5 * * *" # täglich gegen 7:23 Uhr
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  antraege:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          check-latest: true
          cache: npm

      - name: Node-Sicherheitsstand prüfen
        run: |
          node --version
          node -e "const [major, minor, patch] = process.versions.node.split('.').map(Number); if (major !== 22 || minor < 23 || (minor === 23 && patch < 4)) process.exit(1)"
      - run: npm ci

      - name: Parser testen
        run: npm test

      - name: Ratsinformationssystem abgleichen
        run: npm run antraege

      - name: Inhalte in index.html schreiben
        run: npm run render

      - name: Änderungen committen
        run: |
          git add data/antraege.json index.html impressum.html datenschutz.html assets/app.mjs
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Anträge aktualisieren"
          git pull --rebase
          git push
